[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daplis-rtp"
# Read from daplis_rtp.__version__ rather than duplicated here, so that the
# package, the app and the CHANGELOG cannot state different versions.
dynamic = ["version"]
description = "Data Analysis Package for LInoSpad - Real-Time Plotting"
authors = [{ name = "Sergei Kulkov", email = "sergei.kulkov23@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["timestamp", "analysis", "LinoSPAD2"]

dependencies = [
    # Capped below 3.11: that release folded 'matplotlib/style/core.py' into
    # 'matplotlib/style/__init__.py', removing the 'matplotlib.style.core'
    # submodule. mplcyberpunk 0.7.6 (the newest release) calls
    # 'mpl.style.core.read_style_directory()' at import time and declares no
    # upper bound of its own, so an unpinned install pairs the two and the app
    # dies on startup with "module 'matplotlib.style' has no attribute 'core'".
    # Lift this once mplcyberpunk supports matplotlib 3.11.
    "matplotlib>=3.6.2,<3.11",
    "mplcyberpunk",
    "numpy>=1.23.5",
    "PyQt5>=5.15.7",
    "qdarkstyle>=3.2.0",
]

[tool.setuptools.dynamic]
version = { attr = "daplis_rtp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"daplis_rtp" = [
    "params/masks/*.txt",
    "params/calibration_data/*.csv",
    # The rendered application icon. The 1024 px master it comes from
    # stays in "assets" and is deliberately not shipped.
    "resources/*.png",
    "resources/*.ico",
]

[project.scripts]
daplis-rtp = "daplis_rtp.main:main"

[project.urls]
Homepage = "https://github.com/rngKomorebi/daplis-rtp"