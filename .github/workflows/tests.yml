name: Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One version failing should not cancel the others' results.
      fail-fast: false
      matrix:
        # Ubuntu pinned rather than 'latest': setup-python only builds
        # the Pythons still supported when an Ubuntu release comes out,
        # so each new 'latest' silently drops the oldest versions (26.04
        # starts at 3.10). 24.04 has every version tested here.
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    # The tests build the GUI on Qt's offscreen platform, which still
    # needs the system libraries Qt's GUI module links against.
    - name: Install Qt system libraries
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . pytest
    - name: Test with pytest
      run: python -m pytest
