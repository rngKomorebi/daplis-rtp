name: Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One version failing should not cancel the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
        # ubuntu-latest is 24.04, for which setup-python has no 3.8
        # build; 3.8 is tested on 22.04 instead.
        exclude:
          - os: ubuntu-latest
            python-version: '3.8'
        include:
          - os: ubuntu-22.04
            python-version: '3.8'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    # The tests build the GUI on Qt's offscreen platform, which still
    # needs the system libraries Qt's GUI module links against.
    - name: Install Qt system libraries
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . pytest
    - name: Test with pytest
      run: python -m pytest
